name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-plugins
      - name: Unit tests
        run: composer test
      - name: Scrub check (no em-dash)
        run: composer scrub:check

  # The Shopware Store gate: shopware-cli extension validate is the tool the
  # producer upload path runs. It exits 1 on an error and 0 on a warning, so the
  # step is the verdict. The CLI is deliberately unpinned, because a pinned copy
  # of the rules would pass here and still be rejected on upload; a new rule
  # reddening this job is the gate reporting that the Store's rules moved.
  store-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shopware/shopware-cli-action@b67b48ccb52beb8533ea276152e1f89f29bbd080 # v3.0.0
        with:
          version: latest
      - name: Shopware Store validation
        run: shopware-cli extension validate . --store-compliance